run_name: AmBe2.0v3
display_label: "AmBe v3 real data (waveform-gated)"
campaign: "AmBe 2.0v3"
description: >
  Real AmBe source-calibration data, v3 hardware/campaign (new PMT setup,
  Campaign 2/3 pre-v4). Waveform IC-gated (590 < IC_adjusted < 1340) then
  ambe_single_cut-selected via run_waveform_gated_pipeline.py. No MVA/MC
  involved -- efficiency and capture-time computed directly from the real
  candidate data.

output_root: /exp/annie/app/users/dajana/AmBeNeutronsAnalysis/ambe_output/ambe_data

inputs:
  trigger_summary: /exp/annie/app/users/dajana/AmBeNeutronsAnalysis/TriggerSummary/AmBeTriggerSummary_AmBe2.0v3.csv
  candidate_csvs: /exp/annie/app/users/dajana/AmBeNeutronsAnalysis/EventAmBeNeutronCandidatesData/EventAmBeNeutronCandidates_AmBe2.0v3_*.csv

cuts:
  pe_max: 100
  charge_balance_max: 0.45

fit_params: {}
