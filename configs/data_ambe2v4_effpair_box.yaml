run_name: AmBe2.0v4_effpair_box
display_label: "AmBe v4 efficiency pair 6264 / 6265 (+6266 cross-check), box cuts"
campaign: "AmBe 2.0v4"
description: "AmBe data: ambe2v4_effpair_box"

output_root: ambe_output/ambe_data

stage1:
  data_directory: /exp/annie/app/users/dajana/AmBeNeutronsAnalysis/ambe_output/stage_v4/effpair
  waveform_dir: /pnfs/annie/persistent/users/dajana/AmBe/AmBe2.0v4
  file_pattern: 'BeamCluster_(\d+)\.root'
  campaign: 1
  which_tree: 1
  selection_mode: ic
  ic_min: 700
  ic_max: 1200
  plot_ic: true
  save_waveform_samples: false
  dump_event_index: true
  dump_good_events: true
  tag: AmBe2.0v4_effpair_box
  extra_source_positions:
    6264: [0.0, 0.0, -999.0]
    6265: [0.0, 0.0, 0.0]
    6266: [0.0, 100.0, 0.0]
    6046: [0.0, 0.0, -998.0]   # sentinel: 6046 is also (0,0,0) but staged in its own pass below

inputs:
  trigger_summary:
    - /exp/annie/app/users/dajana/AmBeNeutronsAnalysis/TriggerSummary/AmBeTriggerSummary_AmBe2.0v4_effpair_box.csv
  candidate_csvs:
    - /exp/annie/app/users/dajana/AmBeNeutronsAnalysis/EventAmBeNeutronCandidatesData/EventAmBeNeutronCandidates_AmBe2.0v4_effpair_box_*.csv
  event_index:
    - /exp/annie/app/users/dajana/AmBeNeutronsAnalysis/TriggerSummary/EventIndex_AmBe2.0v4_effpair_box_*.parquet

cuts:
  pe_max: 100
  charge_balance_max: 0.45
  time_min_ns: 2000
  time_max_ns: 67000
  cluster_hits_min: 5
  plot_min_cluster_hits: 0
  # Derived from the cuts above by BoxSelection.__init__; kept here only as a label
  # for plots. It is no longer a free-text claim that nothing checks.
  selection_label: "box cuts PE ≤ 100, CB < 0.45, 2 ≤ t ≤ 67 µs, hits ≥ 5"

fit_params:
  source_run: 6265
  background_run: 6264
  crosscheck_run: 6266

  n_bins: 8

  denominator: ambe_triggers        # ambe_triggers | total_events
  numerator_mode: noncosmic         # noncosmic | production

  nominal_model: poisson            # data_driven | poisson

  gof_min_p_value: 0.01
  n_gof_toys: 2000
  nominal_model_override_justification: >-
    The uncorrelated-background model does not describe the high-multiplicity tail.
    This is the SAME failure the thesis reports in 8.6.2 ("the uncorrelated
    background model fit underestimates the high multiplicity tail"), where it gives
    chi2/ndof = 11/5 at position 0; 46 of our 51.4 comes from multiplicity bins 3-4,
    and our sample is 1.6x larger so the same physical mismatch carries more
    leverage. It means the real background is not Poisson in time, which is a
    statement about the detector, not a defect in the extraction.
    The alternative is not better: the data-driven fit's p ~ 0.4 is an artefact of
    background run 6264 having 22 AmBe triggers, whose template uncertainty
    dominates the chi2 denominator from bin 2 up. Removing sigma_bkg moves that fit
    from 0.640 to 0.351 with chi2/ndof ~ 854
    (scripts/diagnose_datadriven_chi2.py --source 6265 --bkg 6264). A fit that good
    for that reason is not evidence of a better model.
    delta_m (the signed distance to the data-driven fit) is therefore carrying real
    model uncertainty rather than noise, and the number should be read as
    preliminary until a background run with usable statistics exists.

  likelihood: thesis_chi2             # thesis_chi2 | multinomial
  background_uncertainty: thesis_diagonal   # thesis_diagonal | bootstrap
  n_bootstrap: 400

  # Overflow. 'fail' refuses to merge physically different multiplicities into one
  # bin; 'clip' folds them into the top bin, which then means ">= n_bins-1".
  overflow_policy: fail             # fail | clip

  acquisition_window_ns: 67000
  signal_window_start_ns: 2000
  bkg_window_start_ns: 2000

  eff_grid:    {min: 0.30, max: 0.95, step: 0.001}
  lambda_grid: {min: 0.00, max: 0.60, step: 0.002}

  n_throws: 1000000
  seed: 20260910

  engine: analytic                  # analytic | mc

  template_fluctuate: false

waveform_cuts:
  sideband_ic: [1600, 2500]

systematics:
  livetime_s:
    6264: null
    6265: null
    6266: null
  # Optional per-run livetime uncertainty in seconds. When supplied it is propagated
  # into delta_bt alongside the Poisson errors on the two trigger counts.
  livetime_unc_s:
    6264: null
    6265: null
    6266: null

  delta_h_housing_fraction: null
  delta_h_housing_fraction_unc: null
  housing_n_captures: null
  housing_n_simulated: null
