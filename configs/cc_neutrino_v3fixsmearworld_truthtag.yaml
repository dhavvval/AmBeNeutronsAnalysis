# productionv3fix world WCSim re-run through today's ToolAnalysis dev build (cff4e58:
# ANNIEsoft merge, PMTWaveformSim time smearing on, waveform hit charge/PE branches).
# Files: world parts 1-6; made by v3fix_local/today_samples/run_today.sh.
run_name: cc_neutrino_v3fixsmearworld_truthtag
display_label: "CC Neutrino v3 WORLD — TRUTH-tag streamline (out-of-tank background)"
campaign: "MC CC Neutrino productionv3fix world parts 1-6, dev build cff4e58 (smearing on)"
description: >
  Same streamline and cuts as the productionv3fix truth-tag config it was copied from, on
  productionv3fix world parts 1-6 (4,164 events) re-run through the dev ToolAnalysis build cff4e58.
  Used for the cluster-purity study (ambe plots provenance --deck clusterpurity).

output_root: ambe_output

inputs:
  root_files:
    - /exp/annie/data/users/dajana/v3fix_local/today_samples/out/ANNIEEvent_world_*.root

cuts:
  min_pulses_per_event: 0

  cc_stream: ccinc_truthtag_world

  cc_cuts:
    # Fiducial volume: OFF. The keys are kept for documentation — the world streams
    # do not reference the fv_* cuts at all, so these values are inert.
    require_fv: false
    fv_radius_cm: 100.0
    fv_y_max_cm: 100.0
    fv_require_z_negative: false
    # muon phase space — identical to the tank streamlines
    mu_p_min_mev: 600.0
    mu_p_max_mev: 1200.0
    cos_theta_min: 0.8
    nhit_min: 4
    # tagging — truth side
    require_cc: true
    require_fsl_muon: true
    require_no_veto: false
    require_mrd: false
    mrd_source: cluster
    require_prompt_pe: false
    prompt_pe_min: 500.0
    prompt_pe_max: 3000.0

fit_params: {}

residual:
  # cc_only: FALSE — deliberately different from the tank streamlines.
  # Clusters are built for EVERY event, not just cc_pass ones, which is what makes
  # the unconditional out-of-tank background harvest possible. cc_pass is still
  # computed and stored per cluster; the per-origin gating happens at merge time in
  # mva_analysis.py (_apply_cc_filter), where it can change without reprocessing.
  cc_only: false
  prompt_window_ns: 2000

optics:
  min_samples: [8]
  xi: [0.02]
  t_unit_ns: [25]
  truth_window_ns: 75.0
  hit_prefilter_ns: 0.0

features:
  min_samples: 8
  xi: 0.02
  t_unit_ns: 25.0
  hit_prefilter_ns: 0.0
  truth_window_ns: 75.0

geometry:
  pmt_geometry:   /exp/annie/app/users/dajana/EB_BC_TA/configfiles/LoadGeometry/FullTankPMTGeometry.csv
  frame: tank
  apply_timing_offsets: false
  timing_offsets: /exp/annie/app/users/dajana/EB_BC_TA/configfiles/LoadGeometry/TankPMTTimingOffsets.csv
