cuts:
  time_min_ns: 2000
  time_max_ns: 67000

clusterindex:
  window_ns: [2000, 67000]
  extra_source_positions:
    6264: [0.0, 0.0, -999.0]
  gate_event_index:
    - /exp/annie/app/users/dajana/AmBeNeutronsAnalysis/TriggerSummary/EventIndex_AmBe2.0v4_all28_box_veto_*.parquet
    - /exp/annie/app/users/dajana/AmBeNeutronsAnalysis/TriggerSummary/EventIndex_AmBe2.0v4_effpair_box_6264.parquet
