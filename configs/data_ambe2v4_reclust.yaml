run_name: AmBe2.0v4_reclust
display_label: "AmBe v4 data, 26 source runs + 6264, re-clustered (no box)"
campaign: "AmBe 2.0v4"
description: >
  v4 source runs re-clustered with the MC clusterers (ambe data randoms --cluster, MC config
  mc_ambe_v3fix_reclust) for the Data/MC comparison without box cuts. 6187 (Port 3 y=-60, no MC)
  and 6249 (LAPPD on, +227 PE/trigger leak) are left out; 6264 is the no-source background run.
