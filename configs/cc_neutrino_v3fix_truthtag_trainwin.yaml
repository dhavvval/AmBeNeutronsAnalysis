run_name: cc_neutrino_v3fix_truthtag_trainwin
display_label: "CC Neutrino v3 \u2014 TRUTH-tag, fixed geometry + capture truth (FV,\
  \ p_mu, cos, isCC, FSL mu)"
campaign: MC CC Neutrino (productionv3 tank/fmvmrd, 498 usable files)
description: Same run as cc_neutrino_v3fix_truthtag.yaml (reads its pulses), but with
  the residual window of the original training (prompt_window_ns 10000, cc_only as
  in the original config), so features written with --output ...__cluster_features__trainwin.parquet
  compare like-for-like with the frozen-MVA training sample.
output_root: ambe_output
inputs:
  root_files:
  - /pnfs/annie/persistent/users/dajana/output/genie_wcsim_tank/productionv3fix/tank/fmvmrd/ANNIEEvent_cc_neutrino_v3fix_*.root
cuts:
  min_pulses_per_event: 0
  cc_stream: ccinc_truthtag
  cc_cuts:
    require_fv: true
    fv_radius_cm: 100.0
    fv_y_max_cm: 100.0
    fv_require_z_negative: false
    mu_p_min_mev: 600.0
    mu_p_max_mev: 1200.0
    cos_theta_min: 0.8
    nhit_min: 4
    require_cc: true
    require_fsl_muon: true
    require_no_veto: false
    require_mrd: false
    mrd_source: cluster
    require_prompt_pe: false
    prompt_pe_min: 500.0
    prompt_pe_max: 3000.0
fit_params: {}
residual:
  cc_only: true
  prompt_window_ns: 10000
optics:
  min_samples:
  - 8
  xi:
  - 0.02
  t_unit_ns:
  - 25
  truth_window_ns: 75.0
  hit_prefilter_ns: 0.0
features:
  methods:
  - optics
  - clusterfinder
  - peak
  min_samples: 8
  xi: 0.02
  t_unit_ns: 25.0
  hit_prefilter_ns: 0.0
  truth_window_ns: 75.0
geometry:
  pmt_geometry: /exp/annie/app/users/dajana/EB_BC_TA/configfiles/LoadGeometry/FullTankPMTGeometry.csv
  timing_offsets: /exp/annie/app/users/dajana/EB_BC_TA/configfiles/LoadGeometry/TankPMTTimingOffsets.csv
  frame: tank
  apply_timing_offsets: false
