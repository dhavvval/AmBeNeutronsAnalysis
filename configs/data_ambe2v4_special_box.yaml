run_name: AmBe2.0v4_special_box
display_label: "AmBe v4 special runs, traditional box cuts"
campaign: "AmBe 2.0v4"
description: >
  The six labelled-no-source special runs, selected with the TRADITIONAL BOX CUTS.
  Reported SEPARATELY and NEVER merged into the campaign. No efficiency and no
  capture time is quoted for any run here -- they exist to show what a no-source run
  looks like under the same selection as the campaign.

  THE RUNS
    6254, 6256   pulser pair. ZERO IC-passing triggers (0 of 7,932 and 0 of 4,254).
                 They produce no candidates at all; that is the result, not a failure.
    6264         cosmic-dominated. Vetoes at ~98 % on this box path and gives ZERO
                 Stage-2 candidates. The MVA route quotes 93.3 % for the same run,
                 because it re-derives cluster features in a (-5, +20) ns delayed
                 window so its clusterPE differs and the >100 PE veto flips on a
                 handful of events. Quote each route's own number; never mix them.
    6265, 6266, 6270   behave source-in, 0.64-0.74 candidates per AmBe trigger.

  6270 IS THE CORRUPTED MERGE. BeamCluster_6270.root still contains 11,279 duplicated
  events of 46,211 (24.4 %), per FIX_6270.md. Its gated-trigger count only agrees
  with the MVA route (2,312) after deduplicating on eventTimeTank; undeduplicated it
  reads 2,941 (+27 %). Check this after every run of this config.

  EXPECTED GATED TRIGGERS, as established independently via the MVA route in
  ANALYSIS_ccinc_v3_FULL.md 6.7 -- assert these so the two routes cannot diverge:
    6264 -> 149,  6265 -> 2,150,  6266 -> 2,171,  6270 -> 2,312.

  The source positions below are supplied through stage1.extra_source_positions and
  are DELIBERATELY not added to processor.py source_positions: that map drives the
  campaign efficiency heatmaps, and putting labelled-no-source runs into it would
  fold them into the published efficiency.

output_root: /exp/annie/app/users/dajana/AmBeNeutronsAnalysis/ambe_output/ambe_data

stage1:
  data_directory: /exp/annie/app/users/dajana/AmBeNeutronsAnalysis/ambe_output/stage_v4/special6
  waveform_dir: /pnfs/annie/persistent/users/dajana/AmBe/AmBe2.0v4
  file_pattern: 'BeamCluster_(\d+)\.root'
  # 1 = read the RWM_ TDirectories, 2 = BRF_. The v4 waveform files contain
  # BOTH, and the 700-1200 IC window was tuned on RWM_: reading BRF_ instead
  # accepts 0 of 38,451 waveforms on run 6062 and puts fprompt at 0.016
  # against the expected 0.22. Verified on 6062: campaign 1 gives 39.57 %
  # accepted, cosmic 19.06 %, fprompt median 0.219.
  campaign: 1
  which_tree: 1
  # Stage-1 gate, pinned so it cannot drift. 'ic' = IC window + second-pulse
  # veto and NOTHING else -- in particular no fprompt cut. fprompt is still
  # computed and dumped as a diagnostic, so the log prints its median; that is
  # a report, not a cut. Do not set 'ic+fprompt' or 'fprompt2d' for these decks.
  selection_mode: ic
  ic_min: 700
  ic_max: 1200
  plot_ic: true
  save_waveform_samples: false
  tag: AmBe2.0v4_special_box
  # Mirrored from ccinc_v3_ambe_closure.py SPECIAL_POSITIONS / SPECIAL_PORT so the
  # two routes label the same run with the same position.
  extra_source_positions:
    6254: [0.0, 0.0, 0.0]
    6256: [0.0, 0.0, 0.0]
    6264: [0.0, 0.0, 0.0]
    6265: [0.0, 0.0, 0.0]
    6266: [0.0, 100.0, 0.0]
    6270: [75.0, 0.0, 0.0]

inputs:
  trigger_summary:
    - /exp/annie/app/users/dajana/AmBeNeutronsAnalysis/TriggerSummary/AmBeTriggerSummary_AmBe2.0v4_special_box.csv
  candidate_csvs:
    - /exp/annie/app/users/dajana/AmBeNeutronsAnalysis/EventAmBeNeutronCandidatesData/EventAmBeNeutronCandidates_AmBe2.0v4_special_box_*.csv

cuts:
  pe_max: 100
  charge_balance_max: 0.45
  # Plot-only cut inside src/ambe/plots/basic.py prepare_data. Set to 0 here on
  # purpose: it is NOT part of either selection, and the MVA deck has no hits
  # requirement at all, so a hidden >=10 would make the two decks incomparable
  # AND misrepresent deck 3 as having a hits cut. Same value in both configs.
  plot_min_cluster_hits: 0
  selection_label: "Special runs, box cuts PE ≤ 100, CB < 0.45, t ≥ 2 µs, hits ≥ 5"

fit_params: {}
