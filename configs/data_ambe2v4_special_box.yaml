    6254: [0.0, 0.0, 0.0]
    6256: [0.0, 0.0, 0.0]
    6264: [0.0, 0.0, 0.0]
    6265: [0.0, 0.0, 0.0]
    6266: [0.0, 100.0, 0.0]
    6270: [75.0, 0.0, 0.0]

