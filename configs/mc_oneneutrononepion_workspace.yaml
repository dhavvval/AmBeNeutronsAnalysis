run_name: mc_oneneutrononepion
campaign: "MC AmBe One-Neutron + One-Pion (debug)"
description: >
  Debug file with exactly one neutron + one pion per event.
  Purpose: directly characterise pion-induced hit contamination —
  timing overlap with the neutron capture cluster, spatial topology,
  and effect on OPTICS performance.  These hits are the Population 2
  class -5 background identified in the Lucho beam file.
  Output redirected into workspace so sandbox can read parquets.

# Output inside workspace mount so sandbox can read parquets after running
output_root: /Users/dajana/Documents/AmBe/AmBeNeutronsAnalysis/ambe_output

inputs:
  root_files:
    # ⚠ Confirm this path on your machine before running
    - /Users/dajana/Documents/ANNIEEvent_MC_AmBe_wcsim_oneneutrononepion.root

cuts:
  min_pulses_per_event: 0  # OPTICS min_samples handles thresholding — do not pre-filter events here
  # max_events: 300   # uncomment for a quick test run

fit_params: {}

optics:
  # Same grid as oneneutron — compare performance impact of pion
  min_samples: [3, 5, 8]
  xi: [0.10]
  t_unit_ns: [10, 25]
  truth_window_ns: 75.0
  hit_prefilter_ns: 2000.0         # grid sweep only
  source_position_m: [0.0, 0.0, 0.0]

features:
  min_samples: 3                   # permissive — want to find both clusters
  xi: 0.10
  t_unit_ns: 10.0
  hit_prefilter_ns: 0.0            # no prefilter during feature extraction
  truth_window_ns: 75.0
  source_position_m: [0.0, 0.0, 0.0]

geometry:
  pmt_geometry:   /Users/dajana/Documents/ToolAnalysis/configfiles/LoadGeometry/FullTankPMTGeometry.csv
  timing_offsets: /Users/dajana/Documents/ToolAnalysis/configfiles/LoadGeometry/TankPMTTimingOffsets.csv
