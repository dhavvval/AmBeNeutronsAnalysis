run_name: AmBe2.0v4_bkgnorm_nobox
display_label: "AmBe v4 data, all 34 runs (EB_BC_TA_pr/full rebuild), TA ClusterFinder + C++ merge clusters, no box"
campaign: "AmBe 2.0v4"
description: >
  Step 3 of the background-normalisation plan (WORKLOG_bkgnorm_reprocess.md, plan P4.1 "CF+NMS from TA").
  Per-trigger tree ClusterFinder clusters (20 ns / 5 hits + C++ time merge 50/2000) of the 2026-10-30
  BeamCluster rebuild, read with `ambe data randoms --no-hits`; counted with `ambe stats clusterindex
  --tree-box --methods clusterfinder_tree` (cluster time in 2-67 us, no PE / charge-balance cut).
  Gate ic = the triggers of the AmBe2.0v4_bkgnorm Stage-1 EventIndex (IC 700-1200); gate none = every trigger.
output_root: ambe_output
