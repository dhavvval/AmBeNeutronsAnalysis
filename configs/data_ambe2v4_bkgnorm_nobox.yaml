  time_max_ns: 67000

clusterindex:
  window_ns: [2000, 67000]
  extra_source_positions:
    6264: [0.0, 0.0, -999.0]
    6265: [0.0, 0.0, 0.0]
    6266: [0.0, 100.0, 0.0]
    6270: [75.0, 0.0, 0.0]
