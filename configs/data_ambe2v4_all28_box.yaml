run_name: AmBe2.0v4_all28_box
display_label: "AmBe v4 real data, 28 source runs, traditional box cuts"
campaign: "AmBe 2.0v4"
description: "AmBe data: ambe2v4_all28_box"

output_root: /exp/annie/app/users/dajana/AmBeNeutronsAnalysis/ambe_output/ambe_data

stage1:
  data_directory: /exp/annie/app/users/dajana/AmBeNeutronsAnalysis/ambe_output/stage_v4/source28
  waveform_dir: /pnfs/annie/persistent/users/dajana/AmBe/AmBe2.0v4
  file_pattern: 'BeamCluster_(\d+)\.root'
  campaign: 1
  which_tree: 1
  selection_mode: ic
  ic_min: 700
  ic_max: 1200
  plot_ic: true
  save_waveform_samples: false
  # Output tag. NOT AmBe2.0v4_gated / _ext / _fprompt -- those back published
  # numbers and processor.py refuses to write them without --allow-protected-tag.
  tag: AmBe2.0v4_all28_box

inputs:
  trigger_summary:
    - /exp/annie/app/users/dajana/AmBeNeutronsAnalysis/TriggerSummary/AmBeTriggerSummary_AmBe2.0v4_all28_box.csv
  candidate_csvs:
    - /exp/annie/app/users/dajana/AmBeNeutronsAnalysis/EventAmBeNeutronCandidatesData/EventAmBeNeutronCandidates_AmBe2.0v4_all28_box_*.csv

cuts:
  pe_max: 100
  charge_balance_max: 0.45
  plot_min_cluster_hits: 0
  selection_label: "box cuts PE ≤ 100, CB < 0.45, t ≥ 2 µs, hits ≥ 5"

fit_params: {}
