run_name: AmBe2.0v4_all28_box
display_label: "AmBe v4 real data, 28 source runs, traditional box cuts"
campaign: "AmBe 2.0v4"
description: >
  Real AmBe source-calibration data, v4 campaign, all 28 source runs across 26 source
  positions and all five ports, selected with the TRADITIONAL BOX CUTS. This is the
  deck-2 analysis.

  The neutron cluster definition is
      0 < clusterPE <= 100,  0 < chargeBalance < 0.45,
      clusterTime >= 2000 ns,  clusterHits >= 5
  applied after the Stage-1 IC waveform gate (700 < IC_adjusted < 1200 plus the
  second-pulse veto) and the cosmic veto (any cluster with clusterTime < 2 us or
  clusterPE > 100 drops the whole event). No MVA and no MC anywhere.

  WHY THIS EXISTS ALONGSIDE data_ambe2v4_all28.yaml. That config READS the published
  per-tag summaries (_gated + _ext) and must keep doing so -- it is the reference the
  57.23 % efficiency and the tau = 30.53 +- 0.26 us anchor were measured with. This
  config WRITES a fresh single-tag reproduction of the same selection, so that the
  box and MVA analyses are produced by one code path under one tag each and can be
  compared cell for cell. If the two disagree, this one is wrong.

  WHY data_directory IS A STAGING DIRECTORY. AmBePMTWaveforms scans data_directory
  for every file matching file_pattern, and the real /pnfs AmBe2.0v4 directory holds
  all 34 runs -- the 28 source runs AND the 6 special runs (6254, 6256, 6264, 6265,
  6266, 6270). Pointing at it directly would silently fold the special runs into the
  campaign efficiency, which is exactly what must never happen. The staging directory
  holds symlinks to the 28 source BeamCluster files only. waveform_dir stays on the
  real tree because it is indexed by run name (waveform_dir/<run>/**/*.root), so it
  needs no filtering.

  Run 6248 is absent on purpose: it is in processor.py source_positions at
  (75, 50, 0) but has no BeamCluster ntuple and no waveform directory anywhere on
  disk. That position is covered only by the LAPPD debug pair 6249/6250.

output_root: /exp/annie/app/users/dajana/AmBeNeutronsAnalysis/ambe_output/ambe_data

stage1:
  data_directory: /exp/annie/app/users/dajana/AmBeNeutronsAnalysis/ambe_output/stage_v4/source28
  waveform_dir: /pnfs/annie/persistent/users/dajana/AmBe/AmBe2.0v4
  file_pattern: 'BeamCluster_(\d+)\.root'
  # 1 = read the RWM_ TDirectories, 2 = BRF_. The v4 waveform files contain
  # BOTH, and the 700-1200 IC window was tuned on RWM_: reading BRF_ instead
  # accepts 0 of 38,451 waveforms on run 6062 and puts fprompt at 0.016
  # against the expected 0.22. Verified on 6062: campaign 1 gives 39.57 %
  # accepted, cosmic 19.06 %, fprompt median 0.219.
  campaign: 1
  which_tree: 1
  # Stage-1 gate, pinned so it cannot drift. 'ic' = IC window + second-pulse
  # veto and NOTHING else -- in particular no fprompt cut. fprompt is still
  # computed and dumped as a diagnostic, so the log prints its median; that is
  # a report, not a cut. Do not set 'ic+fprompt' or 'fprompt2d' for these decks.
  selection_mode: ic
  ic_min: 700
  ic_max: 1200
  plot_ic: true
  save_waveform_samples: false
  # Output tag. NOT AmBe2.0v4_gated / _ext / _fprompt -- those back published
  # numbers and processor.py refuses to write them without --allow-protected-tag.
  tag: AmBe2.0v4_all28_box

inputs:
  trigger_summary:
    - /exp/annie/app/users/dajana/AmBeNeutronsAnalysis/TriggerSummary/AmBeTriggerSummary_AmBe2.0v4_all28_box.csv
  candidate_csvs:
    - /exp/annie/app/users/dajana/AmBeNeutronsAnalysis/EventAmBeNeutronCandidatesData/EventAmBeNeutronCandidates_AmBe2.0v4_all28_box_*.csv

cuts:
  pe_max: 100
  charge_balance_max: 0.45
  # Printed verbatim as the first line of every plot title in this analysis.
  # Plot-only cut inside src/ambe/plots/basic.py prepare_data. Set to 0 here on
  # purpose: it is NOT part of either selection, and the MVA deck has no hits
  # requirement at all, so a hidden >=10 would make the two decks incomparable
  # AND misrepresent deck 3 as having a hits cut. Same value in both configs.
  plot_min_cluster_hits: 0
  selection_label: "box cuts PE ≤ 100, CB < 0.45, t ≥ 2 µs, hits ≥ 5"

fit_params: {}
