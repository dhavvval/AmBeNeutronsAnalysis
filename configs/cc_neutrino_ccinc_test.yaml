run_name: ccinc_test87
display_label: "CC-Inclusive cut-stream validation (FMV/MRD test)"
campaign: "MC CC Neutrino (FMVMRDTEST87, 1000 evt)"
description: >
  CC-inclusive (CCInc) cut-stream validation against a single richer test file
  that carries MRD / FMV-veto / cluster branches (unlike the tank-only
  production files). Reco branches (recoVtx*, recoMuonKE, promptMuonTotalPE,
  Qij) are absent, so James's reco-level cuts are applied as truth-level
  equivalents from trueFSLMomentum_*; MRD is treated as 100% efficient (any MRD
  activity -> tagged). Defines several named streams (ccinc_truth, ccinc_mrd,
  ccinc_truth_plus_mrd) and supports per-cut N-1 impact studies + a raw-MC-stats
  estimator for ML training. See src/ambe/mc/cc_selection.py.

output_root: /exp/annie/app/users/dajana/AmBeNeutronAnalysis/ambe_output

inputs:
  root_files:
    - /exp/annie/app/users/dajana/EB_BC_TA/ANNIEEvent_cc_neutrino_FMVMRDTEST87.root

cuts:
  max_events: 1000

  # Offline CC-inclusive event selection.
  cc_cuts:
    # Which streams to run by default (CLI --stream overrides this).
    # cc0pi_legacy reproduces the original (exclusive) selection for comparison.
    streams: [cc0pi_legacy, ccinc_truth, ccinc_mrd, ccinc_truth_plus_mrd]

    # --- CCInc cut values (James's CCPR reference) ---
    require_cc: true            # trueCC == 1
    require_fsl_muon: true      # trueFSLPdg == 13  (final-state lepton is muon)
    mu_p_min_mev: 600           # muon momentum from |trueFSLMomentum_(X,Y,Z)|
    mu_p_max_mev: 1200
    cos_theta_min: 0.8          # cos(theta) = pz/p > 0.8 (beam = Z)

    require_fv: true            # true vertex inside tank FV (EventSelector convention)
    fv_radius_cm: 121.9         # 0.8 * tank_radius (152.4 cm)
    fv_y_max_cm: 50.0           # |Y| < 50 cm
    fv_require_z_negative: true # set false to isolate the Z<0 half-cut's effect

    nhit_min: 4

    # --- MRD tag under the 100%-efficiency assumption ---
    require_mrd: true
    mrd_source: cluster         # cluster (MRDClusterNumber>0) | tracks | coinc
    require_no_veto: true       # NoVeto == 1 (no FMV veto hit)

    # --- optional prompt-PE-from-hits cut (off by default) ---
    require_prompt_pe: false
    prompt_pe_min: 500
    prompt_pe_max: 3000

    # --- training-size estimator targets (selected-sample sizes) ---
    train_targets: [1000, 5000, 10000, 50000]

    # --- optionally redefine/add custom streams (list of cut ids) ---
    # cc_streams:
    #   ccinc_no_fvz: [cc, fsl_muon, mu_p, cos_theta, fv_radius, fv_y, nhit]

fit_params: {}

# Prompt window reused by the optional prompt_pe cut (sum hitPE for hitT <= this).
residual:
  cc_only: true
  prompt_window_ns: 2000
