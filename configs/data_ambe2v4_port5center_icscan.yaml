run_name: AmBe2.0v4_port5center_icscan
display_label: "AmBe v4, Port 5 (centre) only, wide IC pass for the window scan"
campaign: "AmBe 2.0v4"
description: >
  Real AmBe source-calibration data, v4 campaign, restricted to the FIVE CENTRE-PORT
  (Port 5) source runs, selected with the traditional box cuts and a DELIBERATELY WIDE
  Stage-1 IC gate of 500 < IC_adjusted < 1500.

  The neutron cluster definition is unchanged from the deck-2 box analysis
  (data_ambe2v4_all28_box.yaml):
      0 < clusterPE <= 100,  0 < chargeBalance < 0.45,
      clusterTime >= 2000 ns,  clusterHits >= 5
  applied after the Stage-1 IC waveform gate plus the second-pulse veto, and after the
  cosmic veto (any cluster with clusterTime < 2 us or clusterPE > 100 drops the whole
  event). No MVA and no MC anywhere. The ONLY thing that differs from the deck-2 box
  config is the width of the Stage-1 IC gate.

  WHY THE WIDE GATE. This tag exists to feed `ambe data icscan`, which varies the IC
  window in steps of 50 across 500-1500 and recomputes the efficiency for each window
  OFFLINE. A waveform rejected at Stage 1 is never Stage-2 processed and therefore
  cannot yield a neutron candidate under ANY narrower window -- it would return "zero
  neutrons" by construction rather than by physics. So the pass has to be run once at
  the WIDEST window in the scan, and every scan point taken as a subset of it. All of
  the scan windows are strict subsets of (500, 1500), so this one pass covers them all
  and the scan itself needs no further waveform or /pnfs read.

  DO NOT quote the efficiency of THIS tag as the AmBe efficiency. Its denominator
  (ambe_triggers) is the 500-1500 tag sample, not the production 700-1200 one. The
  production number stays the one from data_ambe2v4_all28_box.yaml.

  WHY NOT REUSE AmBe2.0v4_fprompt. That tag also has a wide IC gate (500-2000), but its
  Stage-1 mode is 'fprompt2d', i.e. its acceptance carries a 0.15 < fprompt < 0.30 cut
  baked in. fprompt must not enter any AmBe efficiency number, so that tag is unusable
  here and a fresh 'ic'-mode pass is mandatory. fprompt is still computed and dumped as
  a diagnostic by compute_waveform_features; that is a report, not a cut.

  WHY NO STAGING DIRECTORY, unlike data_ambe2v4_all28_box.yaml.
  run_complete_analysis_pipeline discovers runs by matching file_pattern against
  data_directory, so the five runs are named in the regex instead of symlinked into a
  staging tree. That keeps the run list visible in this file and structurally excludes
  both the 23 non-Port-5 source runs and the 6 special no-source runs (6254, 6256,
  6264, 6265, 6266, 6270) that share the same /pnfs directory. Group 1 of the regex
  still captures the run number, which is what the pipeline reads.

  The five runs and their positions, from processor.py source_positions -- one run per
  position, which is what makes the closure test in `ambe data icscan --mode closure`
  exact against the frozen all28_box summary rows:
      6046 (0,   0, 0)    6252 (0,  50, 0)    6165 (0, 100, 0)
      6251 (0, -50, 0)    6062 (0,-100, 0)

output_root: /exp/annie/app/users/dajana/AmBeNeutronsAnalysis/ambe_output/ambe_data

stage1:
  data_directory: /pnfs/annie/persistent/users/dajana/AmBe/AmBe2.0v4
  waveform_dir: /pnfs/annie/persistent/users/dajana/AmBe/AmBe2.0v4
  file_pattern: 'BeamCluster_(6046|6062|6165|6251|6252)\.root'
  # 1 = read the RWM_ TDirectories, 2 = BRF_. The v4 waveform files contain BOTH, and
  # the IC scale this whole scan is expressed in was measured on RWM_: reading BRF_
  # instead accepts 0 of 38,451 waveforms on run 6062. Must match the deck-2 box
  # config or the scan is on a different axis than the production window.
  campaign: 1
  which_tree: 1
  # 'ic' = IC window + second-pulse veto and NOTHING else. Must not be changed:
  # 'ic+fprompt' / 'fprompt2d' would put an fprompt cut inside the scan denominator.
  selection_mode: ic
  ic_min: 500
  ic_max: 1500
  plot_ic: true
  save_waveform_samples: false
  # The per-event index the scan needs. cosmic_events is the ONE quantity that cannot
  # be reconstructed from the already-published dumps: PromptAmBeNeutronCandidates
  # carries no event key, so a cosmic event cannot be assigned an IC value and the
  # denominator ambe_triggers = total_events - cosmic_events cannot be re-sliced.
  # total_events and unique_neutron_triggers CAN be reconstructed (verified to the unit
  # on all five runs against AmBeTriggerSummary_AmBe2.0v4_all28_box.csv); this closes
  # the gap so the whole scan is a pandas groupby.
  dump_event_index: true
  tag: AmBe2.0v4_port5center_icwide

inputs:
  trigger_summary:
    - /exp/annie/app/users/dajana/AmBeNeutronsAnalysis/TriggerSummary/AmBeTriggerSummary_AmBe2.0v4_port5center_icwide.csv
  candidate_csvs:
    - /exp/annie/app/users/dajana/AmBeNeutronsAnalysis/EventAmBeNeutronCandidatesData/EventAmBeNeutronCandidates_AmBe2.0v4_port5center_icwide_*.csv
  waveform_features:
    - /exp/annie/app/users/dajana/AmBeNeutronsAnalysis/TriggerSummary/WaveformFeatures_AmBe2.0v4_port5center_icwide_*.parquet
  event_index:
    - /exp/annie/app/users/dajana/AmBeNeutronsAnalysis/TriggerSummary/EventIndex_AmBe2.0v4_port5center_icwide_*.parquet
  # The frozen 700 < IC < 1200 production reference, for `--mode closure`.
  reference_trigger_summary:
    - /exp/annie/app/users/dajana/AmBeNeutronsAnalysis/TriggerSummary/AmBeTriggerSummary_AmBe2.0v4_all28_box.csv

cuts:
  pe_max: 100
  charge_balance_max: 0.45
  # Plot-only cut inside src/ambe/plots/basic.py prepare_data; 0 here to match the
  # deck-2 box config, so nothing hidden differs between the two.
  plot_min_cluster_hits: 0
  selection_label: "box cuts PE ≤ 100, CB < 0.45, t ≥ 2 µs, hits ≥ 5"

icscan:
  # Scan grid. The Stage-1 pass window above must be at least as wide as this, or scan
  # points would fall outside the processed sample and read as zero by construction
  # rather than by physics. icscan asserts that and aborts naming the pass window.
  ic_lo_start: 500
  ic_hi_start: 1500
  step: 50
  # The production window, re-tallied by --mode closure and checked cell-for-cell
  # against reference_trigger_summary.
  closure_ic_min: 700
  closure_ic_max: 1200

fit_params: {}
