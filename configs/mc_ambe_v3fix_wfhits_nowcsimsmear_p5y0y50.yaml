run_name: mc_ambe_v3fix_wfhits_nowcsimsmear_p5y0y50
display_label: "AmBe MC productionv3fix Port 5 y=0 and y=+50, waveform hits, no WCSim time smearing (PMTWaveformSim + PhaseIIADCHitFinder), 15 dead PMTs, IC-gated 6264 hit overlay"
campaign: "AmBe MC productionv3fix"
description: >
  The 50 + 50 productionv3fix AmBe WCSim files of Port 5 z0 and z50 (y = 0, +50) rerun through the ToolAnalysis MC chain with waveform-hit
  clustering (EB_BC_TA dev 1303687, libWCSimRoot 3a382c66), LoadWCSim UseDigitSmearedTime 0: PMTWaveformSim on the
  raw MCHits at the true first-photon time (no WCSim digit time smearing; PMTWaveformSim TimeSmearing on), PhaseIIADCHitFinder (Fixed_2023_Gains, threshold 7) with BuildWaveformMCHits, ClusterFinder on
  WaveformMCHits, exact per-hit parents. The tree hit list (hitT, hitPE, hitLineage*) is the waveform-hit list.
  Background everywhere = the no-source run 6264, IC 700-1200 gated with the cosmic veto (22 triggers): hit overlay
  random_hits_6264icveto, capture tag ov6264icveto. Capture offset calibrated on this sample.
output_root: ambe_output
inputs:
  root_files:
    - /exp/annie/data/users/dajana/v3fix_local/today_samples/wfhits_ambe_nowcsimsmear/port5_z0QE_1.50/ANNIEEvent_MC_AmBe_*.root
    - /exp/annie/data/users/dajana/v3fix_local/today_samples/wfhits_ambe_nowcsimsmear/port5_z50QE_1.50/ANNIEEvent_MC_AmBe_*.root
cuts:
  min_pulses_per_event: 0
  time_min_ns: 2000
  time_max_ns: 67000

truth:
  hit_source: mchit
  dp_offset_ns: 0.0

residual:
  cc_only: false
  prompt_window_ns: 2000

features:
  min_samples: 5
  xi: 0.01
  t_unit_ns: 25.0
  hit_prefilter_ns: 0.0
  truth_window_ns: 75.0

capture_truth:
  overlay_tag: ov6264icveto
  window_ns: [2000, 67000]

clusterindex:
  window_ns: [2000, 67000]
  label_map: /exp/annie/data/users/dajana/v3fix_local/today_samples/wfhits_ambe/label_map.txt
  overlay_veto:
    random_hits: ambe_output/data_bkg_randoms_6264_6256/parquet/data_bkg_randoms_6264_6256__random_hits_6264icveto.parquet
    cfclusters:  ambe_output/data_bkg_randoms_6264_6256/parquet/data_bkg_randoms_6264_6256__random_cfclusters_6264.parquet

geometry:
  pmt_geometry:   /exp/annie/app/users/dajana/EB_BC_TA/configfiles/LoadGeometry/FullTankPMTGeometry.csv
  timing_offsets: /exp/annie/app/users/dajana/EB_BC_TA/configfiles/LoadGeometry/TankPMTTimingOffsets.csv
  frame: tank
  apply_timing_offsets: false

fit_params: {}
