run_name: mc_steven_port5
campaign: "MC AmBe Steven — Port 5 z=0"
description: >
  Steven's AmBe-spectrum WCSim file, Port 5 centre (0,0,0).
  ~1000 events, realistic AmBe neutron energy spectrum.
  No beam background — class -5 should be prompt AmBe gamma (4.44 MeV) only.
  Key comparison: parallel to Lucho file to isolate beam vs. AmBe-intrinsic
  contributions to Population 2 class -5 contamination.
  Output redirected into workspace so sandbox can read parquets.

output_root: /Users/dajana/Documents/AmBe/AmBeNeutronsAnalysis/ambe_output

inputs:
  root_files:
    - /Users/dajana/Documents/ANNIEEvent_MC_AmBe_wcsim_0_999.root

cuts:
  min_pulses_per_event: 0  # OPTICS min_samples handles thresholding — do not pre-filter events here

fit_params: {}

optics:
  min_samples: [3, 5, 8]
  xi: [0.10]
  t_unit_ns: [10, 25]
  truth_window_ns: 75.0
  hit_prefilter_ns: 2000.0
  source_position_m: [0.0, 0.0, 0.0]   # Port 5 centre

features:
  min_samples: 8
  xi: 0.10
  t_unit_ns: 10.0
  hit_prefilter_ns: 0.0
  truth_window_ns: 75.0
  source_position_m: [0.0, 0.0, 0.0]

geometry:
  pmt_geometry:   /Users/dajana/Documents/ToolAnalysis/configfiles/LoadGeometry/FullTankPMTGeometry.csv
  timing_offsets: /Users/dajana/Documents/ToolAnalysis/configfiles/LoadGeometry/TankPMTTimingOffsets.csv
