# productionv3fix world WCSim re-run through today's ToolAnalysis dev build (cff4e58:
# ANNIEsoft merge, PMTWaveformSim time smearing on, waveform hit charge/PE branches).
# Files: all 20 productionv3fix world parts; made by workflow/Snakefile (rule ta).
run_name: cc_neutrino_v3fixnufullworld_truthtag
display_label: "CC Neutrino v3 WORLD — TRUTH-tag streamline (out-of-tank background)"
campaign: "MC CC Neutrino productionv3fix world parts 1-20, dev build cff4e58 (smearing on)"
description: >
  All 20 productionv3fix world parts (~14,000 events) re-run through the dev ToolAnalysis build
  cff4e58, same cuts as cc_neutrino_v3fixsmearworld_truthtag, with per-MCHit truth and the best g48 OPTICS setting (ms5, xi 0.01, 25 ns). Used for the full-sample neutrino-cluster study.

output_root: ambe_output

inputs:
  root_files:
    - /exp/annie/data/users/dajana/v3fix_local/today_samples/out/ANNIEEvent_world_1.root
    - /exp/annie/data/users/dajana/v3fix_local/today_samples/out/ANNIEEvent_world_2.root
    - /exp/annie/data/users/dajana/v3fix_local/today_samples/out/ANNIEEvent_world_3.root
    - /exp/annie/data/users/dajana/v3fix_local/today_samples/out/ANNIEEvent_world_4.root
    - /exp/annie/data/users/dajana/v3fix_local/today_samples/out/ANNIEEvent_world_5.root
    - /exp/annie/data/users/dajana/v3fix_local/today_samples/out/ANNIEEvent_world_6.root
    - /exp/annie/data/users/dajana/v3fix_local/today_samples/out/ANNIEEvent_world_7.root
    - /exp/annie/data/users/dajana/v3fix_local/today_samples/out/ANNIEEvent_world_8.root
    - /exp/annie/data/users/dajana/v3fix_local/today_samples/out/ANNIEEvent_world_9.root
    - /exp/annie/data/users/dajana/v3fix_local/today_samples/out/ANNIEEvent_world_10.root
    - /exp/annie/data/users/dajana/v3fix_local/today_samples/out/ANNIEEvent_world_11.root
    - /exp/annie/data/users/dajana/v3fix_local/today_samples/out/ANNIEEvent_world_12.root
    - /exp/annie/data/users/dajana/v3fix_local/today_samples/out/ANNIEEvent_world_13.root
    - /exp/annie/data/users/dajana/v3fix_local/today_samples/out/ANNIEEvent_world_14.root
    - /exp/annie/data/users/dajana/v3fix_local/today_samples/out/ANNIEEvent_world_15.root
    - /exp/annie/data/users/dajana/v3fix_local/today_samples/out/ANNIEEvent_world_16.root
    - /exp/annie/data/users/dajana/v3fix_local/today_samples/out/ANNIEEvent_world_17.root
    - /exp/annie/data/users/dajana/v3fix_local/today_samples/out/ANNIEEvent_world_18.root
    - /exp/annie/data/users/dajana/v3fix_local/today_samples/out/ANNIEEvent_world_19.root
    - /exp/annie/data/users/dajana/v3fix_local/today_samples/out/ANNIEEvent_world_20.root

cuts:
  min_pulses_per_event: 0

  cc_stream: ccinc_truthtag_world

  cc_cuts:
    # Fiducial volume: OFF. The keys are kept for documentation — the world streams
    # do not reference the fv_* cuts at all, so these values are inert.
    require_fv: false
    fv_radius_cm: 100.0
    fv_y_max_cm: 100.0
    fv_require_z_negative: false
    # muon phase space — identical to the tank streamlines
    mu_p_min_mev: 600.0
    mu_p_max_mev: 1200.0
    cos_theta_min: 0.8
    nhit_min: 4
    # tagging — truth side
    require_cc: true
    require_fsl_muon: true
    require_no_veto: false
    require_mrd: false
    mrd_source: cluster
    require_prompt_pe: false
    prompt_pe_min: 500.0
    prompt_pe_max: 3000.0

capture_truth:
  offset_ns: 7.87353515625   # calibrate_offset on all 20 files; pinned so per-file grid shards match one run

truth:
  hit_source: mchit

fit_params: {}

residual:
  # cc_only: FALSE — deliberately different from the tank streamlines.
  # Clusters are built for EVERY event, not just cc_pass ones, which is what makes
  # the unconditional out-of-tank background harvest possible. cc_pass is still
  # computed and stored per cluster; the per-origin gating happens at merge time in
  # mva_analysis.py (_apply_cc_filter), where it can change without reprocessing.
  cc_only: false
  prompt_window_ns: 2000

optics:
  min_samples: [5]
  xi: [0.01]
  t_unit_ns: [25]
  truth_window_ns: 75.0
  hit_prefilter_ns: 0.0

features:
  min_samples: 5
  xi: 0.01
  t_unit_ns: 25.0
  hit_prefilter_ns: 0.0
  truth_window_ns: 75.0

geometry:
  pmt_geometry:   /exp/annie/app/users/dajana/EB_BC_TA/configfiles/LoadGeometry/FullTankPMTGeometry.csv
  frame: tank
  apply_timing_offsets: false
  timing_offsets: /exp/annie/app/users/dajana/EB_BC_TA/configfiles/LoadGeometry/TankPMTTimingOffsets.csv
