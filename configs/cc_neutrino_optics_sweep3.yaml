run_name: cc_neutrino_optics_sweep3
display_label: "CC Neutrino — OPTICS sweep (3% sample, focused 24-config grid)"
campaign: "OPTICS sweep on cc_neutrino_productionv2 3% sample (4x3x2 = 24 configs)"
description: >
  Fast OPTICS hyperparameter sweep on a 3% sample of cc_neutrino_productionv2 to find
  purer-cluster configs than the production baseline (ms=8, xi=0.10, t_unit=25 ns).
  Focused grid covering the over-merge-fix region (larger min_samples, smaller xi,
  smaller t_unit). Evaluates against MC truth; ClusterFinder scored alongside. Reads the
  PARQUET (pulses + clusterfinder) under this run_name, NOT the ROOT files.
  The 3% sample parquet must already exist (make_sweep_sample3.py).

output_root: /exp/annie/app/users/dajana/AmBeNeutronsAnalysis/ambe_output

inputs:
  root_files:
    - /pnfs/annie/persistent/users/dajana/output/genie_wcsim_tank/gridtest/ANNIEEvent_cc_neutrino_*.root

cuts:
  min_pulses_per_event: 0

  cc_stream: ccinc_truth

  cc_cuts:
    require_cc: true
    require_fsl_muon: true
    mu_p_min_mev: 600.0
    mu_p_max_mev: 1200.0
    cos_theta_min: 0.8
    require_fv: true
    fv_radius_cm: 100.0
    fv_y_max_cm: 100.0
    fv_require_z_negative: false
    nhit_min: 4

fit_params: {}

residual:
  cc_only: true
  prompt_window_ns: 2000

optics:
  # FOCUSED grid — 4 x 3 x 2 = 24 configs. Covers the over-merge-fix region plus the
  # ms=8 xi=0.10 t_unit=25 production baseline as the anchor reference row.
  min_samples: [8, 12, 15, 20]     # larger -> denser clusters, reject loose bkg halos
  xi:          [0.02, 0.05, 0.10]  # smaller -> steeper reachability cut, splits blobs
  t_unit_ns:   [10, 25]            # tighter in time (baseline 25)
  truth_window_ns: 75.0
  hit_prefilter_ns: 2000.0

geometry:
  pmt_geometry:   /exp/annie/app/users/dajana/EB_BC_TA/configfiles/LoadGeometry/FullTankPMTGeometry.csv
  timing_offsets: /exp/annie/app/users/dajana/EB_BC_TA/configfiles/LoadGeometry/TankPMTTimingOffsets.csv
