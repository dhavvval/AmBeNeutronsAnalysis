run_name: mc_ambe_v3fix_wf_dtho6256
display_label: "AmBe MC productionv3fix, waveform model in the data clock, 6256 dummy-trigger hits overlaid in ToolAnalysis, 15 dead PMTs"
campaign: "AmBe MC productionv3fix"
description: >
  All 1250 ntuples (25 labels x 50 files x 1000 events) of productionv3fix_wf_nosmear_dataclock_dtho6256_dead15
  (setup A, 2026-10-30; Port 4 regenerated at x = +75 cm on 2026-11-02). EB_BC_TA_pr/full 13cf277: PMTWaveformSim
  TimeShift 1074 (data clock), PhaseIIADCHitFinder WaveformMCHits, DummyTriggerHitsOverlay (one 6256 trigger per
  event, TimeOffset 0), ClusterFinder 20 ns / 5 hits + C++ time merge 50/2000, 15-PMT mask. The overlay hits are
  already in the ntuple, so no Python overlay: the tree ClusterFinder clusters (method clusterfinder) are the
  C++-merged clusters, and the cosmic veto acts on them directly.
output_root: ambe_output
inputs:
