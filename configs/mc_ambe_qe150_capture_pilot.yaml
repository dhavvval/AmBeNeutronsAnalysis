run_name: mc_ambe_qe150_capture_pilot
display_label: "AmBe MC QE1.50 — port 5 capture-truth pilot"
campaign: "AmBe MC QE1.50"
description: >
  Port-5 pilot (z = -100, 0, +100 cm; 3 files each) for capture-matched truth,
  cluster event displays, time-NMS and the time-peak finder. Hit x,y,z are
  tank-centred metres, so the port-5 source sits at (0, z/100, 0); it is read per
  file from _source_file by ambe.mc.capture_truth, not from a single config value.

output_root: ambe_output

inputs:
  root_files:
    - /pnfs/annie/persistent/users/dajana/output/AmBe_MC_toolchain/productionv2/QE_1.50/port5_z0QE_1.50/ANNIEEvent_MC_AmBe_port5_z0QE_1.50_0_999.root
    - /pnfs/annie/persistent/users/dajana/output/AmBe_MC_toolchain/productionv2/QE_1.50/port5_z0QE_1.50/ANNIEEvent_MC_AmBe_port5_z0QE_1.50_1000_1999.root
    - /pnfs/annie/persistent/users/dajana/output/AmBe_MC_toolchain/productionv2/QE_1.50/port5_z0QE_1.50/ANNIEEvent_MC_AmBe_port5_z0QE_1.50_2000_2999.root
    - /pnfs/annie/persistent/users/dajana/output/AmBe_MC_toolchain/productionv2/QE_1.50/port5_z100QE_1.50/ANNIEEvent_MC_AmBe_port5_z100QE_1.50_0_999.root
    - /pnfs/annie/persistent/users/dajana/output/AmBe_MC_toolchain/productionv2/QE_1.50/port5_z100QE_1.50/ANNIEEvent_MC_AmBe_port5_z100QE_1.50_1000_1999.root
    - /pnfs/annie/persistent/users/dajana/output/AmBe_MC_toolchain/productionv2/QE_1.50/port5_z100QE_1.50/ANNIEEvent_MC_AmBe_port5_z100QE_1.50_2000_2999.root
    - /pnfs/annie/persistent/users/dajana/output/AmBe_MC_toolchain/productionv2/QE_1.50/port5_zminus100QE_1.50/ANNIEEvent_MC_AmBe_port5_zminus100QE_1.50_0_999.root
    - /pnfs/annie/persistent/users/dajana/output/AmBe_MC_toolchain/productionv2/QE_1.50/port5_zminus100QE_1.50/ANNIEEvent_MC_AmBe_port5_zminus100QE_1.50_1000_1999.root
    - /pnfs/annie/persistent/users/dajana/output/AmBe_MC_toolchain/productionv2/QE_1.50/port5_zminus100QE_1.50/ANNIEEvent_MC_AmBe_port5_zminus100QE_1.50_2000_2999.root

cuts:
  min_pulses_per_event: 0

fit_params: {}

features:
  min_samples: 8
  xi: 0.10
  t_unit_ns: 25.0
  hit_prefilter_ns: 0.0
  truth_window_ns: 75.0

capture_truth:
  window_ns: [2000, 67000]
  hit_t_min_ns: 2000
  source_from_filename: port5

geometry:
  pmt_geometry:   /exp/annie/app/users/dajana/EB_BC_TA/configfiles/LoadGeometry/FullTankPMTGeometry.csv
  timing_offsets: /exp/annie/app/users/dajana/EB_BC_TA/configfiles/LoadGeometry/TankPMTTimingOffsets.csv
  apply_timing_offsets: false   # data calibration; WCSim hits carry no per-PMT offsets
