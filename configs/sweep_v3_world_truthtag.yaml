run_name: sweep_v3_world_truthtag
display_label: "OPTICS sweep — ccv3 WORLD truthtag (36-config grid)"
campaign: "OPTICS hyperparameter sweep on cc_neutrino_v3world_truthtag (productionv3 world/fmvmrd)"
description: >
  OPTICS sweep over the ccv3 WORLD truth-tag sample. Copy of
  cc_neutrino_v3world_truthtag.yaml with ONE change: the optics: block lists the
  full 4x3x3 = 36-config grid instead of the frozen production point
  (ms=8, xi=0.02, t=25). cc_stream, cc_cuts, residual and truth windows are
  VERBATIM from the production config.
  Two world-specific settings that differ from the tank sweep and are deliberate:
    * cc_only: FALSE — clusters are built for EVERY event, not just cc_pass ones.
      This is what makes the unconditional out-of-tank background harvest possible.
    * require_fv: false — the FV cut reads trueVtx*, which in a world sample is NOT
      the interaction vertex. See cc_stream ccinc_truthtag_world in cc_selection.py.
  WHY SWEEP THIS SEPARATELY FROM TANK: ~77% of this sample interacts outside the
  tank, and world in-tank events are not FV-selected, so the sample contains
  near-wall events the tank sample never holds. Near-wall clusters are exactly
  where OPTICS behaviour can differ (reflections, truncated light cones, different
  hit topology). A joint sweep would be 95% tank by hit count and would average
  that away. Compare this sweep's __optics_summary.csv against
  sweep_v3_tank_truthtag's: agreeing optima mean one config serves the merged
  training; diverging optima are a real finding about near-wall clustering.

# output_root is DELIBERATELY not set here. paths.output_root() resolves
# explicit > $AMBE_OUT > <repo>/ambe_output, so hardcoding it would override
# the AMBE_OUT the EAF runner exports and write into the shared gpvm tree.
# Set AMBE_OUT in the environment to choose where this run lands.

inputs:
  root_files:
    - /pnfs/annie/persistent/users/dajana/output/genie_wcsim_world/productionv3/world/fmvmrd/ANNIEEvent_cc_neutrino_world_*.root

cuts:
  min_pulses_per_event: 0

  cc_stream: ccinc_truthtag_world

  cc_cuts:
    # Fiducial volume: OFF — the world streams do not reference the fv_* keys.
    require_fv: false
    fv_radius_cm: 100.0
    fv_y_max_cm: 100.0
    fv_require_z_negative: false
    # muon phase space — identical to the tank streamline
    mu_p_min_mev: 600.0
    mu_p_max_mev: 1200.0
    cos_theta_min: 0.8
    nhit_min: 4
    # tagging — truth side
    require_cc: true
    require_fsl_muon: true
    require_no_veto: false
    require_mrd: false
    mrd_source: cluster
    require_prompt_pe: false
    prompt_pe_min: 500.0
    prompt_pe_max: 3000.0

fit_params: {}

residual:
  # FALSE on purpose — see the description. Do not "fix" this to match tank.
  cc_only: false
  prompt_window_ns: 10000

optics:
  
  min_samples: [5, 8, 10, 12, 15, 20]
  xi:          [0.02, 0.10]
  t_unit_ns:   [15, 25]
  truth_window_ns:  75.0
  hit_prefilter_ns: 0.0
  n_jobs: 1

geometry:
  pmt_geometry:   /exp/annie/app/users/dajana/EB_BC_TA/configfiles/LoadGeometry/FullTankPMTGeometry.csv
  timing_offsets: /exp/annie/app/users/dajana/EB_BC_TA/configfiles/LoadGeometry/TankPMTTimingOffsets.csv
