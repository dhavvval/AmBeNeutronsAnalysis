run_name: AmBe2.0v4_effpair_box_6046
display_label: "AmBe v4 efficiency for run 6046 (the actual run behind the campaign 71.8% at (0,0,0)), box cuts"
campaign: "AmBe 2.0v4"
description: "AmBe data: ambe2v4_effpair_box_6046"

output_root: ambe_output/ambe_data

stage1:
  data_directory: /exp/annie/app/users/dajana/AmBeNeutronsAnalysis/ambe_output/stage_v4/effpair
  waveform_dir: /pnfs/annie/persistent/users/dajana/AmBe/AmBe2.0v4
  file_pattern: 'BeamCluster_(\d+)\.root'
  campaign: 1
  which_tree: 1
  selection_mode: ic
  ic_min: 700
  ic_max: 1200
  plot_ic: true
  save_waveform_samples: false
  dump_event_index: true
  dump_good_events: true
  tag: AmBe2.0v4_effpair_box
  extra_source_positions:
    6264: [0.0, 0.0, -999.0]
    6265: [0.0, 0.0, 0.0]
    6266: [0.0, 100.0, 0.0]
    6046: [0.0, 0.0, -998.0]

inputs:
  trigger_summary:
    - /exp/annie/app/users/dajana/AmBeNeutronsAnalysis/TriggerSummary/AmBeTriggerSummary_AmBe2.0v4_effpair_box.csv
  candidate_csvs:
    - /exp/annie/app/users/dajana/AmBeNeutronsAnalysis/EventAmBeNeutronCandidatesData/EventAmBeNeutronCandidates_AmBe2.0v4_effpair_box_*.csv
  event_index:
    - /exp/annie/app/users/dajana/AmBeNeutronsAnalysis/TriggerSummary/EventIndex_AmBe2.0v4_effpair_box_*.parquet

cuts:
  pe_max: 100
  charge_balance_max: 0.45
  # Authoritative delayed window; must match fit_params.acquisition_window_ns.
  time_min_ns: 2000
  time_max_ns: 67000
  cluster_hits_min: 5
  plot_min_cluster_hits: 0
  selection_label: "box cuts PE ≤ 100, CB < 0.45, 2 ≤ t ≤ 67 µs, hits ≥ 5"

fit_params:
  source_run: 6046
  background_run: 6264
  crosscheck_run: 6265

  n_bins: 8
  denominator: ambe_triggers
  numerator_mode: noncosmic

  nominal_model: poisson
  gof_min_p_value: 0.01
  n_gof_toys: 2000
  # Fails the gate (p < 1e-3, chi2 = 61.0), for the same documented reason as the
  # 6265 deck -- see that config for the full argument.
  nominal_model_override_justification: >-
    Same known failure as the 6265 deck: the uncorrelated background model
    underestimates the high-multiplicity tail (thesis 8.6.2), and the data-driven
    alternative's good chi2/ndof is an artefact of background run 6264's 22
    triggers rather than a better description. 6046 carries an ADDITIONAL defect the
    6265 deck does not: 6264 was taken during 6265's deployment window, not 6046's,
    and no epoch-matched background run exists for the March 2026 sub-campaign
    (6046, 6056, 6060, 6061, 6062) anywhere in this repo. This number is therefore
    preliminary on two independent counts and must not be quoted without both.

  likelihood: thesis_chi2
  background_uncertainty: thesis_diagonal
  n_bootstrap: 400
  overflow_policy: fail

  acquisition_window_ns: 67000
  signal_window_start_ns: 2000
  bkg_window_start_ns: 2000

  eff_grid:    {min: 0.30, max: 0.95, step: 0.001}
  lambda_grid: {min: 0.00, max: 0.60, step: 0.002}

  n_throws: 1000000
  seed: 20260910
  engine: analytic
  template_fluctuate: false

systematics:
  livetime_s:
    6264: null
    6046: null
    6265: null
  delta_h_housing_fraction: null
  delta_h_housing_fraction_unc: null
