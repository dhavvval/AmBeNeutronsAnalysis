run_name: mc_local_trial
campaign: "MC AmBe Local"
description: "Lucho file — output redirected into workspace for sandbox analysis"

# Output goes INSIDE the workspace so the sandbox can read parquets after this runs
output_root: /Users/dajana/Documents/AmBe/AmBeNeutronsAnalysis/ambe_output

inputs:
  root_files:
    - /Users/dajana/Documents/ANNIEEvent_MC_wcsimlucho_0.root

cuts:
  min_pulses_per_event: 0  # OPTICS min_samples handles thresholding — do not pre-filter events here
  max_events: 300   # quick test; remove this line for full 10k-event run

fit_params: {}

optics:
  min_samples: [3, 8]
  xi: [0.10]
  t_unit_ns: [10, 25]
  truth_window_ns: 75.0
  hit_prefilter_ns: 2000.0
  # Source ToF correction — Port 5 centre for Lucho WCSim file
  source_position_m: [0.0, 0.0, 0.0]

features:
  min_samples: 8
  xi: 0.10
  t_unit_ns: 25.0
  hit_prefilter_ns: 0.0
  truth_window_ns: 75.0
  source_position_m: [0.0, 0.0, 0.0]

geometry:
  pmt_geometry:   /Users/dajana/Documents/ToolAnalysis/configfiles/LoadGeometry/FullTankPMTGeometry.csv
  timing_offsets: /Users/dajana/Documents/ToolAnalysis/configfiles/LoadGeometry/TankPMTTimingOffsets.csv
