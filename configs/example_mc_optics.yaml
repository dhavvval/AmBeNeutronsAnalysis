# ------------------------------------------------------------------
# Example MC OPTICS run.
# Copy this file to configs/<something>.yaml, edit, and run:
#   ambe mc process --config configs/<something>.yaml
#   ambe mc optics  --config configs/<something>.yaml
#   ambe pipeline mc --config configs/<something>.yaml   # all of the above
#
# Everything that varies between runs lives here. Nothing else in the
# code should be hardcoded per-campaign.
# ------------------------------------------------------------------

run_name: mc_optics_trial01            # appears in every output filename
campaign: "MC AmBe Darknoise"          # appears in every plot title
description: "OPTICS training on MC AmBe with per-pulse darknoise truth labels."

# Override $AMBE_OUT from the environment if you want a per-run location:
# output_root: /pnfs/annie/persistent/users/dajana/ambe_output/

inputs:
  root_files:
    - /exp/annie/app/users/dajana/EB_BC_TA/ANNIETree_MC.root
  # Example glob form:
  # root_files:
  #   - /pnfs/annie/persistent/users/dajana/mc/BeamCluster_*.root

cuts:
  # nothing MC-specific yet; placeholder for reproducibility
  min_pulses_per_event: 3

fit_params: {}

# Free-form block; anything here is accessible as ctx.extra[...]
optics:
  min_samples: [3, 5, 8]       # smaller range: ANNIE clusters are ~16 hits on average

  xi: [0.01, 0.05, 0.10]       # steep-upslope threshold for cluster boundary detection

  # t_unit_ns: physically motivated time-axis scaling (replaces the old t_scale).
  # 1 OPTICS distance unit in time = t_unit_ns nanoseconds.
  # The spatial axes are StandardScaler'd to unit std (~0.75 m for ANNIE).
  # Choosing t_unit_ns = 40 makes 40 ns in time look like 1 spatial std deviation —
  # roughly equal weight, since the capture gamma burst spans ~40 ns (median).
  # Grid spans the range from "time dominates" (25 ns) to "space dominates" (75 ns).
  t_unit_ns: [25, 40, 50, 75]

  # truth_window_ns: single value (not swept) defining recoverable truth signal.
  # Hits outside ±37.5 ns of their cluster's median time are thermalization
  # outliers and are excluded from purity/recall evaluation.
  # Derived from 10k-event sensitivity analysis: median frac_in jumps to 1.0
  # at 75 ns and gains < 2 % beyond that (bimodal gap confirmed).
  truth_window_ns: 75.0
